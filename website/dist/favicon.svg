<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 25 56 56">
  <!-- Tuxport: the terminal prompt as solid geometry, white on the Neon Terminal base.
       Mirrored from the Android launcher foreground and maintained directly as SVG. -->
  <defs>
    <clipPath id="tile" clipPathUnits="userSpaceOnUse">
      <rect x="26" y="25" width="56" height="56" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="26" y="25" width="56" height="56" fill="#0d1117"/>
    <path fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter"
          d="M 40 41.5 L 55.5 54 L 40 66.5"/>
    <path fill="#ffffff" d="M 60 63 H 72.5 V 70 H 60 Z"/>
  </g>
</svg>
