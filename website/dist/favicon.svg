<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 25 56 56">
  <!-- Tuxport: a flat neon Tux carrying a terminal. Maintained directly as SVG;
       mirrored from the Android launcher foreground. -->
  <defs>
    <linearGradient id="neon" x1="54" y1="30" x2="54" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <clipPath id="tile" clipPathUnits="userSpaceOnUse">
      <rect x="26" y="25" width="56" height="56" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="26" y="25" width="56" height="56" fill="#0d1117"/>
    <g>
      <!-- flippers -->
      <path fill="url(#neon)" d="M 43.1 49.5 C 39.2 53 38 59.4 39.7 64.6 C 40.6 67.2 43.1 67.5 44.1 65 C 45.7 60.5 45.3 54.4 44.3 50.6 Z"/>
      <path fill="url(#neon)" d="M 64.9 49.5 C 68.8 53 70 59.4 68.3 64.6 C 67.4 67.2 64.9 67.5 63.9 65 C 62.3 60.5 62.7 54.4 63.7 50.6 Z"/>
      <!-- feet -->
      <path fill="url(#neon)" d="M 47 69.6 C 44.1 69.6 42 71.4 42 73.6 C 42 75 43.4 75.8 45.8 75.8 C 48.3 75.8 49.4 74.9 49.4 73.1 C 49.4 71.2 49.2 69.6 47 69.6 Z"/>
      <path fill="url(#neon)" d="M 61 69.6 C 63.9 69.6 66 71.4 66 73.6 C 66 75 64.6 75.8 62.2 75.8 C 59.7 75.8 58.6 74.9 58.6 73.1 C 58.6 71.2 58.8 69.6 61 69.6 Z"/>
      <!-- body -->
      <path fill="#e6edf3" d="M 54 29.5 C 45.6 29.5 40 38.2 40 48.3 C 40 60.6 42.4 74.2 54 74.2 C 65.6 74.2 68 60.6 68 48.3 C 68 38.2 62.4 29.5 54 29.5 Z"/>
      <!-- eyes -->
      <circle cx="48.9" cy="40.6" r="1.9" fill="#0d1117"/>
      <circle cx="59.1" cy="40.6" r="1.9" fill="#0d1117"/>
      <!-- beak -->
      <path fill="url(#neon)" d="M 50.9 45.2 C 52.4 43.9 55.6 43.9 57.1 45.2 C 57.6 45.6 57.5 46.4 56.8 46.9 C 55.2 48.2 52.8 48.2 51.2 46.9 C 50.5 46.4 50.4 45.6 50.9 45.2 Z"/>
      <!-- chest terminal screen -->
      <rect x="44.6" y="52.6" width="18.8" height="13.6" rx="2.6" fill="#0d1117" stroke="url(#neon)" stroke-width="1.4"/>
      <!-- prompt > _ -->
      <path fill="none" stroke="url(#neon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M 48.6 56.6 L 52.4 59.2 L 48.6 61.8"/>
      <path fill="none" stroke="url(#neon)" stroke-width="1.7" stroke-linecap="round" d="M 55.4 61.8 L 59.6 61.8"/>
    </g>
  </g>
</svg>
