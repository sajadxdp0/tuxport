<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Run Linux on Android.">
    <title>Tuxport</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e6edf3;
        background: #0d1117;
        font-synthesis: none;
      }

      body {
        min-height: 100vh;
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        font-size: 1rem;
        line-height: 1.85;
        overflow-wrap: anywhere;
        background:
          radial-gradient(38rem 18rem at 85% -8%, rgba(255, 64, 129, 0.14), transparent 70%),
          radial-gradient(42rem 20rem at 10% 0%, rgba(0, 229, 255, 0.12), transparent 70%);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.25rem;
        line-height: 1.25;
        letter-spacing: -0.02em;
        text-shadow: 0 0 24px rgba(0, 229, 255, 0.35);
      }
      h1 span { color: #00e5ff; }
      p { margin: 0.75rem 0; }
      .tagline { color: #8b949e; }

      nav {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #30363d;
        font-size: 0.875rem;
      }
      nav::before {
        content: "";
        display: block;
        width: 4rem;
        height: 2px;
        margin-top: -1px;
        background: linear-gradient(90deg, #00e5ff, #ff4081);
      }
      a {
        color: #00e5ff;
        text-decoration-color: rgba(0, 229, 255, 0.45);
        text-underline-offset: 0.2em;
      }
      a:hover { color: #ff4081; text-decoration-color: currentColor; }
      a:focus-visible { outline: 2px solid #00e5ff; outline-offset: 3px; }
      nav a + a::before { content: " · "; color: #484f58; }

      @media (max-width: 480px) {
        body { padding: 2.5rem 1.25rem; }
      }
      @media print {
        body { background: #fff; color: #000; }
        h1 { text-shadow: none; }
        a { color: #000; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>&gt;</span> Tuxport</h1>
      <p class="tagline">Run Linux on Android.</p>
      <nav aria-label="Site">
        <a href="https://github.com/sajadxdp0/tuxport">Source</a>
        <a href="privacy.html">Privacy Policy</a>
      </nav>
    </main>
  </body>
</html>
